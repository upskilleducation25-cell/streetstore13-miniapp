name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ss13
          POSTGRES_PASSWORD: ss13
          POSTGRES_DB: streetstore13
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ss13 -d streetstore13"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://ss13:ss13@localhost:5432/streetstore13?schema=public
      JWT_SECRET: ci-only-jwt-secret-ci-only-jwt-secret-0000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate Prisma schema
        run: pnpm --filter @ss13/api exec prisma validate
      - name: Generate Prisma Client
        run: pnpm --filter @ss13/api prisma:generate
      - run: pnpm format:check
      - name: Temporary Prettier diagnostic
        if: failure()
        run: |
          pnpm exec prettier --write apps/admin/src/features/suppliers/EasyDropPage.tsx apps/api/src/suppliers/easydrop-import.controller.ts apps/api/src/suppliers/easydrop-sync.service.ts
          git diff -- apps/admin/src/features/suppliers/EasyDropPage.tsx apps/api/src/suppliers/easydrop-import.controller.ts apps/api/src/suppliers/easydrop-sync.service.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Apply migrations to clean PostgreSQL
        run: pnpm --filter @ss13/api prisma:deploy
      - name: Verify migration status
        run: pnpm --filter @ss13/api exec prisma migrate status
      - run: pnpm db:seed
      - run: pnpm db:seed:demo
      - run: pnpm test
